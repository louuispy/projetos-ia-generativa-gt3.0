[project]
name = "projeto-leitura-pdf-llm"
version = "0.1.0"
description = "This project was made to show to GT GenerativeAI's course students how they can create chatbots with a tool for read PDF files and YouTube transcriptions in Python, with LangChain."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-community>=0.4.1",
    "langchain[google-genai]>=1.2.9",
    "pypdf>=6.7.0",
    "python-dotenv>=1.2.1",
    "rich>=14.3.2",
    "youtube-transcript-api>=1.2.4",
]
